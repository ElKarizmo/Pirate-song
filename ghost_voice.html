<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio player</title>
<script>
  /* Add ?theme=dark to the iframe link if the page it sits on is dark (keeps the background transparent). */
  (function () {
    var m = /[?&]theme=(dark|light)/.exec(location.search);
    if (m) document.documentElement.style.colorScheme = m[1];
  })();
</script>
<style>
  :root {
    --h: clamp(84px, 21vw, 120px);
    --green: #8b5cf6;
    --green-dark: #2e1065;
    --track: #d9d9d9;
    --ink: #111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: flex; align-items: center; overflow: hidden; -webkit-tap-highlight-color: transparent; }

  .player { --p: 0; position: relative; width: 100%; min-width: 240px; height: var(--h); user-select: none; -webkit-user-select: none; }

  /* Play / pause button */
  .play {
    position: absolute; z-index: 2;
    left: calc(var(--h) * .011); top: calc(var(--h) * .251);
    width: calc(var(--h) * .732); height: calc(var(--h) * .732);
    padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%;
    transition: transform .12s ease, filter .12s ease;
  }
  .play img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .play .ico-pause { display: none; }
  .playing .play .ico-pause { display: block; }
  .playing .play .ico-play { display: none; }
  .play:hover { filter: brightness(1.08); }
  .play:active { transform: scale(.96); }
  .play:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

  /* Progress bar */
  .track {
    position: absolute;
    left: calc(var(--h) * .929); right: calc(var(--h) * .203);
    top: calc(var(--h) * .458); height: calc(var(--h) * .300);
    border-radius: 999px; cursor: pointer; touch-action: none;
  }
  .track::before { content: ""; position: absolute; inset: -12px 0; } /* bigger touch target */
  .track:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .bar {
    position: absolute; inset: 0; overflow: hidden; border-radius: 999px;
    background: var(--track);
    border: max(1px, calc(var(--h) * .012)) solid var(--ink);
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: max(0px, calc(var(--p) * 100% - var(--h) * .06));
    background: linear-gradient(90deg, var(--green), var(--green-dark));
  }

  /* The ghost. Floats above the bar and drifts/bobs while playing, instead of walking. */
  .walker {
    position: absolute; z-index: 1; pointer-events: none;
    left: calc(var(--p) * 100%); transform: translateX(-50%);
    width: calc(var(--h) * .4696); height: calc(var(--h) * .72);
    top: calc(var(--h) * (.0046 - .458) + var(--h) * .09);
  }

<script>
(function () {
  var DURATION = 3.71; // seconds, used until the browser reports the real length
  var player = document.getElementById('player');
  var btn = document.getElementById('play');
  var track = document.getElementById('track');
  var source = document.getElementById('song').textContent.trim();
  var isData = source.indexOf('data:') === 0;

  var bytes = null;
  function getBytes() {
    if (!bytes) {
      var bin = atob(source.slice(source.indexOf(',') + 1));
      bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  /* ---------- Audio engine 1: a normal <audio> element ----------
     Tries a Blob URL first, then the raw data URI. If the page is running somewhere that blocks
     both (some sandboxed previews do), it switches to engine 2 automatically. */
  var candidates = [];
  try { if (isData) candidates.push(URL.createObjectURL(new Blob([getBytes()], { type: 'audio/mpeg' }))); } catch (e) {}
  candidates.push(source);

  var audio = new Audio();
  audio.preload = 'auto';
  var mode = 'html', ci = 0, wantPlay = false, watchdog = 0;

  function loadNext() {
    if (ci < candidates.length) { audio.src = candidates[ci++]; return true; }
    return false;
  }
  function htmlPlay() {
    var r = audio.play();
    if (r && r.catch) r.catch(function () {});
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (mode === 'html' && wantPlay && audio.currentTime === 0 && audio.readyState < 3) useWeb();
    }, 2500);
  }
  function useWeb() {
    if (mode === 'web') return;
    mode = 'web';
    try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch (e) {}
    if (wantPlay) web.play();
  }
  audio.addEventListener('error', function () {
    if (mode !== 'html') return;
    if (loadNext()) { if (wantPlay) htmlPlay(); } else useWeb();
  });
  loadNext();

  /* ---------- Audio engine 2: Web Audio API (not affected by media restrictions) ---------- */
  var web = { ctx: null, buf: null, node: null, loading: null, offset: 0, t0: 0, on: false };

  web.load = function () {
    if (web.loading) return web.loading;
    var AC = window.AudioContext || window.webkitAudioContext;
    web.ctx = new AC();
    var data = isData ? Promise.resolve(getBytes().buffer.slice(0))
                      : fetch(source).then(function (r) { return r.arrayBuffer(); });
    web.loading = data.then(function (ab) {
      return new Promise(function (ok, fail) { web.ctx.decodeAudioData(ab, ok, fail); });
    }).then(function (b) { web.buf = b; return b; });
    return web.loading;
  };
  web.stopNode = function () {
    var n = web.node; web.node = null;
    if (n) { n.onended = null; try { n.stop(); } catch (e) {} }
  };
  web.start = function () {
    web.ctx.resume();
    var n = web.ctx.createBufferSource();
    n.buffer = web.buf;
    n.connect(web.ctx.destination);
    n.onended = function () { if (web.node === n && web.on) finish(); };
    web.node = n;
    web.t0 = web.ctx.currentTime - web.offset;
    n.start(0, web.offset);
  };
  web.play = function () {
    web.on = true;
    setPlaying(true);
    try { web.ctx || web.load(); web.ctx.resume(); } catch (e) {}
    web.load().then(function () { if (web.on && !web.node) web.start(); })
              .catch(function () { web.on = false; setPlaying(false); });
  };
  web.pause = function () {
    if (!web.on) return;
    web.offset = web.now(); web.on = false; web.stopNode();
    setPlaying(false);
  };
  web.now = function () {
    return web.on && web.node ? Math.min(web.ctx.currentTime - web.t0, web.buf.duration) : web.offset;
  };
  web.seek = function (t) {
    web.offset = t;
    if (web.on && web.node) { web.stopNode(); web.start(); }
  };

  /* ---------- One interface for both engines ---------- */
  function dur() {
    if (mode === 'web' && web.buf) return web.buf.duration;
    return isFinite(audio.duration) && audio.duration > 0 ? audio.duration : DURATION;
  }
  function now()  { return mode === 'web' ? web.now() : audio.currentTime; }
  function isOn() { return mode === 'web' ? web.on : !audio.paused; }
  function play()  { wantPlay = true;  if (mode === 'web') web.play(); else htmlPlay(); }
  function pause() { wantPlay = false; if (mode === 'web') web.pause(); else audio.pause(); }
  function seek(t) {
    t = Math.min(dur() - 0.1, Math.max(0, t));
    if (mode === 'web') web.seek(t); else { try { audio.currentTime = t; } catch (e) {} }
  }
  function finish() {           // clip reached the end: stop the ghost and go back to the start
    wantPlay = false;
    if (mode === 'web') { web.on = false; web.stopNode(); web.offset = 0; }
    else audio.currentTime = 0;
    setPlaying(false);
    setProgress(0);
  }

  /* ---------- UI ---------- */
  var dragging = false, raf = 0;
  function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  function setProgress(p) {
    p = Math.min(1, Math.max(0, p));
    player.style.setProperty('--p', p);
    track.setAttribute('aria-valuemax', Math.round(dur()));
    track.setAttribute('aria-valuenow', Math.round(p * dur()));
    track.setAttribute('aria-valuetext', fmt(p * dur()) + ' of ' + fmt(dur()));
  }
  function tick() {
    if (!dragging) setProgress(now() / dur());
    raf = requestAnimationFrame(tick);
  }
  function setPlaying(on) {     // bob animation + pause icon follow this
    player.classList.toggle('playing', on);
    btn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    cancelAnimationFrame(raf);
    if (on) raf = requestAnimationFrame(tick); else setProgress(now() / dur());
  }

  audio.addEventListener('loadedmetadata', function () { setProgress(now() / dur()); });
  audio.addEventListener('play',  function () { if (mode === 'html') setPlaying(true); });
  audio.addEventListener('pause', function () { if (mode === 'html') setPlaying(false); });
  audio.addEventListener('ended', function () { if (mode === 'html') finish(); });

  btn.addEventListener('click', function () { if (isOn()) pause(); else play(); });

  // Click or drag on the bar to seek
  function seekFromPointer(e) {
    var r = track.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    setProgress(p);
    seek(p * dur());
  }
  track.addEventListener('pointerdown', function (e) {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    seekFromPointer(e);
  });
  track.addEventListener('pointermove', function (e) { if (dragging) seekFromPointer(e); });
  function endDrag() { dragging = false; }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Keyboard: arrows jump 2 seconds, Home/End go to the start/end
  track.addEventListener('keydown', function (e) {
    var t = now();
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') t += 2;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') t -= 2;
    else if (e.key === 'Home') t = 0;
    else if (e.key === 'End') t = dur() - 0.5;
    else return;
    e.preventDefault();
    seek(t);
    setProgress(now() / dur());
  });

  setProgress(0);
})();
</script>
